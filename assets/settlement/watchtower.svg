<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g stroke="#4a3520" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- A lone lookout: one slender tower, no pennant and no gate — this is a
         watchpost, not a garrison. -->
    <rect x="42" y="42" width="16" height="40" fill="#b7ae9c"/>
    <!-- battlements -->
    <rect x="42" y="35" width="4" height="9" fill="#b7ae9c"/>
    <rect x="48" y="35" width="4" height="9" fill="#b7ae9c"/>
    <rect x="54" y="35" width="4" height="9" fill="#b7ae9c"/>
    <!-- single arrow slit -->
    <rect x="48.5" y="52" width="3" height="9" fill="#4a3520" stroke="none"/>
    <!-- ladder door at the base -->
    <rect x="46" y="72" width="8" height="10" fill="#5a3a22" stroke="none"/>
  </g>
</svg>
