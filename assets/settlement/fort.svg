<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g stroke="#4a3520" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- A squat tower with flanking walls — a standing garrison holds ground,
         where the watchtower only watches. Walls first, so the tower overlaps. -->
    <rect x="18" y="64" width="22" height="18" fill="#b8b2a4"/>
    <rect x="60" y="64" width="22" height="18" fill="#b8b2a4"/>
    <!-- pennant -->
    <line x1="50" y1="45" x2="50" y2="32"/>
    <polygon points="50,32 62,36 50,40" fill="#9c2f2f"/>
    <!-- tower body -->
    <rect x="40" y="52" width="20" height="30" fill="#b7ae9c"/>
    <!-- battlements -->
    <rect x="40" y="45" width="5" height="9" fill="#b7ae9c"/>
    <rect x="47.5" y="45" width="5" height="9" fill="#b7ae9c"/>
    <rect x="55" y="45" width="5" height="9" fill="#b7ae9c"/>
    <!-- arrow slits -->
    <rect x="44" y="58" width="3" height="7" fill="#4a3520" stroke="none"/>
    <rect x="53" y="58" width="3" height="7" fill="#4a3520" stroke="none"/>
    <!-- gate -->
    <rect x="45" y="70" width="10" height="12" fill="#5a3a22" stroke="none"/>
  </g>
</svg>
