<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g stroke="#4a3520" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- flag pole + red pennant (martial) -->
    <line x1="50" y1="34" x2="50" y2="18"/>
    <polygon points="50,18 67,23 50,29" fill="#9c2f2f"/>
    <!-- tower body -->
    <rect x="37" y="40" width="26" height="38" fill="#b7ae9c"/>
    <!-- battlements / crenellations -->
    <rect x="37" y="33" width="6" height="9" fill="#b7ae9c"/>
    <rect x="47" y="33" width="6" height="9" fill="#b7ae9c"/>
    <rect x="57" y="33" width="6" height="9" fill="#b7ae9c"/>
    <!-- arrow-slit windows -->
    <rect x="43" y="49" width="3" height="8" fill="#4a3520" stroke="none"/>
    <rect x="54" y="49" width="3" height="8" fill="#4a3520" stroke="none"/>
    <!-- gate -->
    <rect x="45" y="64" width="10" height="14" fill="#5a3a22" stroke="none"/>
  </g>
</svg>
